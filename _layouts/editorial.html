<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.editorial_title %}{{ page.editorial_title }} · {% endif %}{{ site.name }}</title>
  <meta name="description" content="Cleone Mitsui studies political expression, social influence, and cultural contexts at Osaka Metropolitan University.">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/editorial.css' | relative_url }}">
  {% include site-analytics.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Cleone Mitsui<span>Political Psychology</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.permalink == '/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.permalink == '/publications/' %}aria-current="page"{% endif %}>Papers</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.permalink == '/cv/' %}aria-current="page"{% endif %}>CV</a>
      <a href="{{ '/presentations.html' | relative_url }}" {% if page.permalink == '/presentations.html' %}aria-current="page"{% endif %}>Presentations</a>
    </nav>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap">
    <div><a class="footer-name" href="{{ '/' | relative_url }}">Cleone Mitsui</a><p>Political Psychology · Osaka, Japan</p><details class="academic-links"><summary>Academic profiles</summary><nav aria-label="Academic profiles"><a href="{{ site.author.googlescholar }}">Google Scholar ↗</a><a href="{{ site.author.orcid }}">ORCID ↗</a><a href="{{ site.author.researchmap }}">Researchmap ↗</a><a href="{{ site.author.researchgate }}">ResearchGate ↗</a></nav></details></div>
    <nav aria-label="Social links">
      <a href="https://twitter.com/{{ site.author.twitter }}">X ↗</a>
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn ↗</a>
      <a href="mailto:{{ site.author.email }}">Email ↗</a>
    </nav>
  </footer>
</body>
</html>
